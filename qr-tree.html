<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR → 3D 树 → Litematica</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#08080f;--s1:#10101c;--s2:#181830;--bd:#282848;--ac:#4caf50;--ab:#66bb6a;--ad:#2e7d32;--ag:rgba(76,175,80,.12);--tx:#e0e0ec;--dm:#777;--rd:#ef5350}
body{background:var(--bg);color:var(--tx);font:14px/1.6 'Noto Sans SC',system-ui,sans-serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:24px 24px;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:1360px;margin:0 auto;padding:16px}

/* ★ header 响应式布局 */
header{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  padding:20px 0 12px;position:relative;
}
header h1{
  width:100%;text-align:center;
  font-size:1rem;color:var(--ac);font-weight:700;letter-spacing:3px;
  order:1;
}
header p{
  width:100%;text-align:center;
  color:var(--dm);margin-top:6px;font-size:.88rem;
  order:2;
}

/* ★ 返回主页按钮 */
.home-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;
  background:var(--s2);border:1px solid var(--bd);border-radius:6px;
  color:var(--dm);font-size:.8rem;font-weight:600;
  text-decoration:none;cursor:pointer;transition:all .18s ease;
  letter-spacing:.3px;
  -webkit-user-select:none;user-select:none;
  position:absolute;left:0;top:20px;
  order:0;
}
.home-btn:hover{border-color:var(--ad);color:var(--ac);background:rgba(76,175,80,.06)}
.home-btn:active{transform:scale(.96)}
.home-btn svg{width:14px;height:14px;fill:currentColor;transition:transform .18s ease}
.home-btn:hover svg{transform:translateX(-2px)}

/* ★ 手机端：按钮脱离绝对定位，独占一行 */
@media(max-width:600px){
  header{flex-direction:column;gap:8px;padding:14px 0 10px}
  .home-btn{
    position:static;
    align-self:flex-start;
    order:-1;
  }
}

.mg{display:grid;grid-template-columns:300px 1fr;gap:14px;margin-top:8px}
@media(max-width:900px){.mg{grid-template-columns:1fr}}
.pn{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:16px}
.pn h3{font-size:.8rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--ac);margin-bottom:12px;font-weight:600}
.cr{margin-bottom:12px}
.cr label{display:block;font-size:.75rem;color:var(--dm);margin-bottom:4px;letter-spacing:.5px;font-weight:600}
.cr input[type=text],.cr select{width:100%;padding:8px 10px;background:var(--s2);border:1px solid var(--bd);border-radius:6px;color:var(--tx);font:inherit;outline:none}
.cr input[type=text]:focus{border-color:var(--ad)}
.cr input[type=range]{width:100%;accent-color:var(--ac);cursor:pointer}
.rv{float:right;font:600 .8rem monospace;color:var(--ac);margin-top:-18px}
.btn{display:block;width:100%;padding:10px;border:none;border-radius:6px;font:600 .9rem/1.2 inherit;cursor:pointer;transition:all .15s}
.bp{background:var(--ac);color:#0a0a0a;margin-bottom:6px}.bp:hover{background:var(--ab)}
.bs{background:var(--s2);color:var(--tx);border:1px solid var(--bd)}.bs:hover{border-color:var(--ad);color:var(--ac)}
.bs:disabled{opacity:.3;cursor:not-allowed}
.row{display:flex;gap:6px;margin-top:6px}
.sw{width:26px;height:26px;border-radius:5px;border:2px solid transparent;cursor:pointer}
.sw.on{border-color:var(--ac)}
.pr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:1100px){.pr{grid-template-columns:1fr}}
.sp{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:12px;min-height:180px}
.sp h4{font-size:.72rem;color:var(--dm);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
#qrCanvas{display:block;margin:0 auto;image-rendering:pixelated;background:#fff;padding:3px;border-radius:3px}
#tc{width:100%;height:400px;border-radius:6px;overflow:hidden;background:#0d0d1a;cursor:grab}
#tc:active{cursor:grabbing}
.sb{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.st{background:var(--s1);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;flex:1;min-width:80px;text-align:center}
.st b{display:block;font:.95rem monospace;color:var(--ac)}.st i{font-size:.65rem;color:var(--dm);font-style:normal}
#sm{margin-top:8px;font-size:.78rem;padding:8px 10px;border-radius:5px;display:none;white-space:pre-wrap}
#sm.ok{display:block;background:rgba(76,175,80,.08);color:var(--ac);border:1px solid rgba(76,175,80,.25)}
#sm.er{display:block;background:rgba(239,83,80,.08);color:var(--rd);border:1px solid rgba(239,83,80,.25)}
#dg{margin-top:6px;font:600 .6rem monospace;color:var(--dm);white-space:pre;word-break:break-all;max-height:140px;overflow-y:auto;display:none;background:var(--s2);padding:6px;border-radius:4px;border:1px solid var(--bd)}
.tg{display:flex;gap:4px;margin-top:6px}
.tg button{flex:1;padding:6px;font:.68rem/1 inherit;background:var(--s2);color:var(--dm);border:1px solid var(--bd);border-radius:5px;cursor:pointer}
.tg button:hover{border-color:var(--ad);color:var(--ac)}
</style>
</head>
<body>
<div class="app">

<header>
  <a class="home-btn" href="/" title="返回主页">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    主页
  </a>
  <h1>QR → 3D TREE → LITEMATICA</h1>
  <p>二维码转 Minecraft 3D 树形混凝土 · 导出投影</p>
</header>

<div class="mg">
<div>
<div class="pn">
<h3>设置</h3>
<div class="cr"><label>QR 内容</label><input type="text" id="inp" value="hello" placeholder="文本或URL"></div>
<div class="cr"><label>纠错</label><select id="ec"><option value="L">L 7%</option><option value="M" selected>M 15%</option><option value="Q">Q 25%</option><option value="H">H 30%</option></select></div>
<div class="cr"><label>树冠高 <span class="rv" id="v1">20</span></label><input type="range" id="r1" min="6" max="50" value="20"></div>
<div class="cr"><label>树干高 <span class="rv" id="v2">4</span></label><input type="range" id="r2" min="0" max="20" value="4"></div>
<div class="cr"><label>半径 <span class="rv" id="v3">0.48</span></label><input type="range" id="r3" min="30" max="65" value="48"></div>
<div class="cr"><label>颜色</label>
<div class="row">
<div class="sw on" data-b="minecraft:green_concrete" style="background:#4a5e28"></div>
<div class="sw" data-b="minecraft:lime_concrete" style="background:#6ea12c"></div>
<div class="sw" data-b="minecraft:dark_prismarine" style="background:#335b50"></div>
<div class="sw" data-b="minecraft:emerald_block" style="background:#17dd62"></div>
<div class="sw" data-b="minecraft:ochre_froglight" style="background:#ecd58a"></div>
</div></div>
<button class="btn bp" id="bGen">生成 3D 树</button>
<button class="btn bs" id="bExp" disabled>导出 .litematic</button>
<button class="btn bs" id="bRaw" disabled style="margin-top:4px">下载原始 NBT</button>
<div id="sm"></div><div id="dg"></div>
</div></div>
<div>
<div class="pr">
<div class="sp"><h4>QR 码</h4><canvas id="qrCanvas" width="200" height="200"></canvas></div>
<div class="sp" style="padding:0;overflow:hidden"><div id="tc"></div></div>
</div>
<div class="tg"><button id="cT">俯视</button><button id="cS">侧视</button><button id="cP">透视</button><button id="cR">重置</button></div>
<div class="sb">
<div class="st"><b id="q1">-</b><i>QR版本</i></div>
<div class="st"><b id="q2">-</b><i>尺寸</i></div>
<div class="st"><b id="q3">-</b><i>方块</i></div>
<div class="st"><b id="q4">-</b><i>文件</i></div>
<div class="st"><b id="q5">-</b><i>bits/pal</i></div>
</div>
</div></div></div>

var BC={'minecraft:air':0,'minecraft:green_concrete':0x4a5e28,'minecraft:lime_concrete':0x6ea12c,'minecraft:dark_prismarine':0x335b50,'minecraft:emerald_block':0x17dd62,'minecraft:ochre_froglight':0xecd58a,'minecraft:brown_concrete':0x6b4226,'minecraft:light_gray_concrete':0x8d8d86};
function render3D(m){
  if(!hasThree||!scene)return;if(treeG)scene.remove(treeG);treeG=new THREE.Group();
  var geo=new THREE.BoxGeometry(.96,.96,.96),cnts={};
  for(var i=0;i<m.a.length;i++){var t=m.a[i];if(t)cnts[t]=(cnts[t]||0)+1}
  var mm={};for(var ty in cnts){var c=BC[m.pal[ty]]||0xccc;var mesh=new THREE.InstancedMesh(geo,new THREE.MeshLambertMaterial({color:c}),cnts[ty]);treeG.add(mesh);mm[ty]={m:mesh,i:0}}
  var dm=new THREE.Object3D(),idx=0;
  for(var y=0;y<m.y;y++)for(var z=0;z<m.z;z++)for(var x=0;x<m.x;x++){var bt=m.a[idx++];if(!bt)continue;var e=mm[bt];dm.position.set(x,y,z);dm.updateMatrix();e.m.setMatrixAt(e.i++,dm.matrix)}
  for(var t in mm)mm[t].m.instanceMatrix.needsUpdate=true;
  var gm=new THREE.Mesh(new THREE.PlaneGeometry(m.x+8,m.z+8),new THREE.MeshLambertMaterial({color:0x1a1a25,transparent:true,opacity:.6}));
  gm.rotation.x=-Math.PI/2;gm.position.set((m.x-1)/2,-.48,(m.z-1)/2);treeG.add(gm);scene.add(treeG);
  tTarget.set((m.x-1)/2,m.y*.3,(m.z-1)/2);tSph.radius=Math.max(m.x,m.z)*1.8;tSph.phi=Math.PI/3;tSph.theta=Math.PI/4;updCam()
}
['r1','r2','r3'].forEach(function(id){E(id).addEventListener('input',function(){var v=E(id).value;if(id==='r1')E('v1').textContent=v;else if(id==='r2')E('v2').textContent=v;else E('v3').textContent=(v/100).toFixed(2)})});
document.querySelectorAll('.sw').forEach(function(s){s.addEventListener('click',function(){document.querySelectorAll('.sw').forEach(function(x){x.classList.remove('on')});s.classList.add('on');sel=s.dataset.b})});
function onGen(){
  try{
    var text=E('inp').value.trim();if(!text){stat('请输入内容',0);return}
    if(typeof qrcode==='undefined'){stat('qrcode 库未加载',0);return}
    if(typeof pako==='undefined'){stat('pako 库未加载',0);return}
    var qr=mkQR(text,E('ec').value);drawQR(qr.grid,qr.size);
    model=buildTree(qr.grid,qr.size,{maxH:+E('r1').value,trunkH:+E('r2').value,rF:+E('r3').value/100,cb:sel});
    render3D(model);var r=makeLitematica(model);nbtData=r.bytes;
    diag('=== Pack ===\n'+r.diag+'\n\n=== NBT ===\n'+diagNBT(r.bytes));
    var gz=pako.gzip(new Uint8Array(r.bytes)).length;
    E('q1').textContent=qr.ver;E('q2').textContent=model.x+'x'+model.y+'x'+model.z;
    E('q3').textContent=model.cnt.toLocaleString();E('q4').textContent=(gz/1024).toFixed(1)+'KB';
    E('q5').textContent=r.bits+'/'+r.pal;E('bExp').disabled=false;E('bRaw').disabled=false;
    stat('OK '+model.x+'x'+model.y+'x'+model.z+' '+model.cnt+' blocks',1)
  }catch(e){console.error(e);stat('Error: '+e.message,0);diag(e.stack||String(e))}
}
function onExp(){if(!model||!nbtData)return;try{var gz=pako.gzip(new Uint8Array(nbtData));var u=URL.createObjectURL(new Blob([gz],{type:'application/octet-stream'}));var a=document.createElement('a');a.href=u;a.download='QR3DTree_'+model.x+'x'+model.y+'x'+model.z+'.litematic';a.click();URL.revokeObjectURL(u);stat('已导出 ('+(gz.length/1024).toFixed(1)+' KB)',1)}catch(e){stat('导出失败: '+e.message,0)}}
function onRaw(){if(!nbtData)return;var u=URL.createObjectURL(new Blob([nbtData],{type:'application/octet-stream'}));var a=document.createElement('a');a.href=u;a.download='debug_nbt.bin';a.click();URL.revokeObjectURL(u)}
E('bGen').onclick=onGen;E('bExp').onclick=onExp;E('bRaw').onclick=onRaw;
E('inp').addEventListener('keydown',function(e){if(e.key==='Enter')onGen()});
E('cT').onclick=function(){setView(0,.01,60)};E('cS').onclick=function(){setView(0,Math.PI/4,60)};
E('cP').onclick=function(){setView(Math.PI/4,Math.PI/3,50)};E('cR').onclick=function(){setView(Math.PI/4,Math.PI/3,50)};
init3D();onGen();
})();
</script>
